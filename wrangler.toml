# Cloudflare Worker: serves the prebuilt Astro site (ASSETS) + the /api/v1 surface.
# KV and D1 bindings are added in P3/P4. Secrets (RIOT_API_KEY) are set out-of-band
# via `wrangler secret put` and never committed.
name = "lolperform"
main = "worker/src/index.ts"
compatibility_date = "2026-06-01"

# Build the static site before deploying so the ASSETS directory exists.
[build]
command = "pnpm --filter @lolperform/web build"

[observability]
enabled = true

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"

# D1 — source of truth (patch history). Create with:
#   wrangler d1 create lolperform
# then paste the returned database_id below (it is not a secret).
[[d1_databases]]
binding = "DB"
database_name = "lolperform"
database_id = "11da0a75-75e5-49f2-a601-fa7f705142da"
migrations_dir = "db/migrations"

# KV — hot cache for computed API responses. Create with:
#   wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "23032c0b19d144aa93a149ce8a85845c"
