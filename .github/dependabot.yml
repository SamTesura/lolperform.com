version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (the native-compiler major) breaks `astro check` — its
      # language tooling drives TS internals that changed in the port
      # ("Cannot read properties of undefined (reading 'fileExists')").
      # Revisit when @astrojs/check supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
