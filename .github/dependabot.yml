version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (the native-compiler major) breaks `astro check` — its
      # language tooling drives TS internals that changed in the port
      # ("Cannot read properties of undefined (reading 'fileExists')").
      # Revisit when @astrojs/check supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Vitest 5 silently breaks mutation testing: @stryker-mutator/vitest-runner
      # 10 declares `vitest: ">=2.0.0"` but cannot drive v5's test filtering, so
      # it runs 0 tests per mutant and every mutant "survives" — the nightly
      # score fell from passing to 7.41% on the 5.0.0 bump while the suite itself
      # stayed green. Revisit when the runner declares real v5 support.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
