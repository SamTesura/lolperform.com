name: quality gates

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect package manager
        id: pm
        run: |
          # `cache` is deliberately separate from `pm`: setup-node's cache needs a
          # lockfile and hard-fails in seconds without one, which reads as a failing
          # gate when the job never even started. Empty means "do not cache".
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT"; echo "cache=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then echo "pm=npm" >> "$GITHUB_OUTPUT"; echo "cache=npm" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; echo "cache=" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pm.outputs.pm == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --no-frozen-lockfile ;;
            yarn) yarn install ;;
            *) npm ci || npm install --legacy-peer-deps ;;
          esac

      # The scanners live in the security workflow, which installs gitleaks and
      # semgrep and checks out full history for them. This job installs neither
      # and checks out one commit, so it says so rather than running a secret
      # scan over a single commit and calling that "full history".
      - name: Run quality gates
        run: node .quality-gates/run-gates.mjs --no-security

      - name: Upload coverage
        if: always() && hashFiles('coverage/coverage-final.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
