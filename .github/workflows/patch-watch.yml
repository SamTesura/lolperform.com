name: Patch Watch

# Crawls every 6h and on demand. Every run compounds the R2 match store (dedup
# by match id), so same-patch runs grow the sample instead of being skipped —
# on a rate-limited key, volume comes from cadence. Patch detection is kept for
# the logs; the pipeline itself tags the dataset by the dominant patch present.

on:
  schedule:
    - cron: '0 */6 * * *'
    # Patch-day sweep: Riot ships patches every two weeks on Wednesdays, with
    # NA deploying ~3–6 AM PT. 15:00 UTC ≈ 7–8 AM PT lands right after NA
    # maintenance, so the site rolls to the new patch hours sooner than the
    # next 6h slot would. Cron can't express "biweekly", so this fires every
    # Wednesday — off-week runs are just ordinary crawls.
    - cron: '0 15 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-watch
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub's hard cap per job is 360 min. The crawl budgets ~330 min
    # (MAX_RUNTIME_MINUTES default) + install/aggregate/load/store overhead.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Latest Data Dragon patch
        id: ddragon
        run: |
          latest=$(curl -fsSL https://ddragon.leagueoflegends.com/api/versions.json | jq -r '.[0]' | cut -d. -f1,2)
          # Never let an unvalidated remote string reach $GITHUB_OUTPUT — later
          # steps would interpolate it into shell (classic Actions injection).
          case "$latest" in
            ''|*[!0-9.]*) echo "Refusing suspicious ddragon patch string: $latest" >&2; exit 1;;
          esac
          echo "patch=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest ddragon patch: $latest"

      - name: Patch already loaded in D1
        id: loaded
        run: |
          json=$(pnpm exec wrangler d1 execute lolperform --remote --json \
            --command "SELECT patch FROM patches ORDER BY generated_at DESC LIMIT 1" 2>/dev/null || echo '[]')
          loaded=$(echo "$json" | jq -r '.[0].results[0].patch // ""')
          echo "patch=$loaded" >> "$GITHUB_OUTPUT"
          echo "Loaded patch: ${loaded:-<none>}"

      - name: Decide
        id: decide
        env:
          # Consume step outputs via env, not ${{ }} inline in the script —
          # env values can't be interpreted as shell syntax.
          DD_PATCH: ${{ steps.ddragon.outputs.patch }}
          DB_PATCH: ${{ steps.loaded.outputs.patch }}
        run: |
          # Always crawl: accumulation makes same-patch runs valuable (the store
          # only grows), and the repo is public so Actions minutes are not the
          # constraint. The patch comparison above stays for observability.
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$DD_PATCH" != "$DB_PATCH" ]; then
            echo "New patch $DD_PATCH (was $DB_PATCH) — store will roll over."
          else
            echo "Patch $DD_PATCH unchanged — compounding the sample."
          fi

      # Pull the accumulated match store so this crawl compounds on prior runs.
      # Non-fatal: a missing object or insufficient R2 token scope = fresh start.
      - name: Restore match store
        if: steps.decide.outputs.run == 'true'
        run: |
          mkdir -p pipeline/data/store
          if pnpm exec wrangler r2 object get lolperform-matches/matches.ndjson \
               --file pipeline/data/store/matches.ndjson --remote 2>/dev/null; then
            echo "Restored $(wc -l < pipeline/data/store/matches.ndjson) stored matches."
          else
            echo "No prior store (fresh start)."
          fi

      - name: Crawl + aggregate
        if: steps.decide.outputs.run == 'true'
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: pnpm --filter @lolperform/pipeline crawl

      # Persist the grown store to R2 BEFORE the D1 load: hours of crawled
      # matches must never be lost to a load failure. Non-fatal on its own.
      # always(): the crawl flushes progress per region, so even a cancelled or
      # failed crawl step (runner eviction, timeout, Riot outage mid-run) leaves
      # a partial store worth uploading — run 30150582885 lost ~6k matches to a
      # runner kill at region 6 of 6 before this.
      - name: Save match store
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          if [ ! -s pipeline/data/store/matches.ndjson ]; then
            echo "No store file to save (crawl died before its first flush)."
            exit 0
          fi
          if pnpm exec wrangler r2 object put lolperform-matches/matches.ndjson \
               --file pipeline/data/store/matches.ndjson --remote 2>/dev/null; then
            echo "Saved $(wc -l < pipeline/data/store/matches.ndjson) matches to the store."
          else
            echo "Store save skipped (check CLOUDFLARE_API_TOKEN has R2 read/write)."
          fi

      - name: Generate load SQL
        if: steps.decide.outputs.run == 'true'
        run: pnpm --filter @lolperform/pipeline load

      # Retries ride out transient D1 import resets ({"D1_RESET_DO":true}).
      - name: Load into D1
        if: steps.decide.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            if pnpm exec wrangler d1 execute lolperform --remote --file db/.generated/load.sql; then
              exit 0
            fi
            echo "Load attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "Load failed after 3 attempts." >&2
          exit 1

      - name: Summary
        if: steps.decide.outputs.run == 'true'
        env:
          DD_PATCH: ${{ steps.ddragon.outputs.patch }}
        run: echo "Loaded patch $DD_PATCH into D1. Live API updates within the 10-min KV TTL."
