name: security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 03:20 ET — dependency advisories land continuously, so re-scan unchanged
    # code too. A repo nobody touched can become vulnerable overnight.
    - cron: '20 7 * * *'
  workflow_dispatch:

# Read-only: on a dispatched run the token would otherwise take the repository
# default, and nothing here writes.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning needs the history, not just the tip. A secret that
          # was committed and then removed is still a burned secret.
          fetch-depth: 0

      - name: Detect package manager
        id: pm
        run: |
          # `cache` is deliberately separate from `pm`: setup-node's cache needs a
          # lockfile and hard-fails in seconds without one, which reads as a failing
          # gate when the job never even started. Empty means "do not cache".
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT"; echo "cache=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then echo "pm=npm" >> "$GITHUB_OUTPUT"; echo "cache=npm" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; echo "cache=" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pm.outputs.pm == 'pnpm'
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # check-latest: the runner image's cached 22.x can predate 22.23.4, the
          # release that rejects the compromised eMudhra CA keys (2026-10).
          check-latest: true

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # pip trusts the certifi bundle it vendors on top of the OS store, and the
      # runner's pip can predate 26.2.2, the first whose bundle drops the
      # compromised eMudhra CAs (2026-10). So semgrep gets its own venv, whose
      # pip is replaced first from a hash-pinned wheel: the sha256 holds even if
      # that download is intercepted, and semgrep itself then comes through the
      # patched bundle (the OS-store half still waits on the runner image's
      # ca-certificates). A venv also sidesteps PEP 668, which pipx was here for.
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --disable-pip-version-check \
            "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --disable-pip-version-check semgrep
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) npm ci || npm install --legacy-peer-deps ;;
          esac

      - name: Run security scanners
        env:
          CI: 'true'
        run: node .quality-gates/run-gates.mjs --security-only
