name: CI

on:
  pull_request:
  push:
    branches: [main]
  # security-autofix.yml starts this on its branch: its pushes use the workflow
  # token, which starts no workflows, and verify and secret-scan are required.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          # check-latest: the runner image's cached 22.x can predate 22.23.4, the
          # release that rejects the compromised eMudhra CA keys (2026-10).
          check-latest: true
      - run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm lint
      # Nothing used to run `format:check`, so a prettier or plugin bump could
      # silently change `.astro` output and land as churn in an unrelated PR
      # (prettier-plugin-astro 1.0.0 did exactly that). Gate it here instead.
      - name: Format check
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build web
        run: pnpm --filter @lolperform/web build
      # Astro drops line breaks adjacent to inline tags, silently joining words
      # on the rendered page — scan every built page so it can't ship again.
      - name: Check rendered whitespace
        run: node scripts/check-inline-whitespace.mjs
      # No audit step here: quality-gates-security.yml runs `pnpm audit` on every
      # PR, every push to main and daily, and security-autofix.yml fixes what a
      # lockfile refresh can. Dependabot security updates open no PR for a
      # package we only reach through another package.

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
