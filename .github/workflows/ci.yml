name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build web
        run: pnpm --filter @lolperform/web build
      # Astro drops line breaks adjacent to inline tags, silently joining words
      # on the rendered page — scan every built page so it can't ship again.
      - name: Check rendered whitespace
        run: node scripts/check-inline-whitespace.mjs
      # `pnpm audit` is retired-upstream for now: npm shut off the classic audit
      # endpoints (HTTP 410, July 2026) and no pnpm release speaks the bulk
      # advisory API yet. Vulnerability coverage continues via GitHub Dependabot
      # security updates (enabled on the repo; same GHSA advisory source).
      # TODO: restore a lockfile audit step once pnpm ships bulk-endpoint support.

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
